{% extends 'dashboard/base.html' %}

{% load static %}

{% block title %}Edit Project{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'dashboard/css/edit_project.css' %}">
{% endblock %}

{% block content %}

<div class="form-container">

    <a href="{% url 'dashboard_projects' %}" class="back-btn">
        <i class="bi bi-arrow-left"></i>
        Back to Projects
    </a>

    <h2>Edit Project</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="save-btn">
            <i class="bi bi-check-circle"></i>
            Update Project
        </button>

    </form>

</div>

{% endblock %}
